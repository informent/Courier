name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: 10.0.x }
      - run: dotnet run --project tests/TransferTests.csproj --nologo
      - shell: pwsh
        run: dotnet publish Courier.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o release\Courier --nologo
      - shell: pwsh
        run: if (!(Test-Path release\Courier\Courier.exe)) { throw 'Courier.exe missing' }
      - shell: pwsh
        run: Copy-Item README.md,LICENSE,RELEASE-NOTES.md,VALIDATION.md release\Courier
      - shell: pwsh
        run: Compress-Archive -Path release\Courier\* -DestinationPath Courier-${{ github.ref_name }}-win-x64.zip
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: true
          body_path: RELEASE-NOTES.md
          files: |
            Courier-${{ github.ref_name }}-win-x64.zip
            release/Courier/Courier.exe
